<header style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">
  <h1>Jimothy Level 2 — climb the Space Needle (prototype)</h1>
  <p>Prototype second level of the Jimothy game. Jimothy the round Seattle raccoon climbs
  the Space Needle, beam by beam, snacking all the way to the saucer.
  Play level 1 at playjimothy.com.</p>

<a id="home-btn" href="/">← LEVEL 1</a>
<div id="proto-tag">PROTOTYPE</div>
<canvas id="c" aria-label="Jimothy climbs the Space Needle game screen" role="img"></canvas>
<div id="mob">
  <div id="mob-left">

  </div>

<script>
'use strict';

function track(name,params){
  try{if(typeof gtag==='function')gtag('event',name,params||{});}catch(e){}
}

const C=document.getElementById('c');
const ctx=C.getContext('2d');
C.width=460;C.height=700;

const VW=460,VH=700;
const WH=5600;                 // world height (px). bottom = ground, top = saucer
const NX=VW/2;                 // needle center x
const GRAVITY=0.42,JUMP_VY=-10.6,WALK_SPD=3.6;
const SAUCER_Y=560;            // world y of saucer deck platform
const GROUND_Y=WH-60;
const NEEDLE_FT=605;           // real height for the HUD

const COL={
  sky0:'#050210',sky1:'#0a1830',sky2:'#0e2040',
  steel:'#aeb6c4',steelDark:'#6d7686',steelLite:'#d7dde8',
  beam:'#b9c1cf',beamEdge:'#59637a',
  fur:'#7a7268',furDark:'#5c554d',belly:'#d7d0c1',mask:'#161311',
  gold:'#ffcc44',blue:'#88ddff'
};

// ── World: platforms (needle cross-beams) ──
// {x,y,w} top surfaces. Built once, deterministic (seeded), tapering with height.
let plats=[],snacks=[],gulls=[];
function seedRand(s){return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function buildWorld(){
  plats=[];snacks=[];
  const rnd=seedRand(20260810);
  plats.push({x:0,y:GROUND_Y,w:VW});                       // ground
  plats.push({x:NX-170,y:GROUND_Y-90,w:110});              // base beams on the legs
  plats.push({x:NX+60,y:GROUND_Y-90,w:110});
  plats.push({x:NX-120,y:GROUND_Y-185,w:100});
  plats.push({x:NX+20,y:GROUND_Y-185,w:100});
  let side=1,prevOff=0;
  for(let y=GROUND_Y-290;y>SAUCER_Y+180;y-=94+rnd()*20){
    const prog=1-(y-SAUCER_Y)/(GROUND_Y-SAUCER_Y);         // 0 bottom → 1 top
    const spread=110-62*prog;                              // taper
    const w=100-26*prog+rnd()*22;
    let off=side*(12+rnd()*spread*0.6);
    // keep every hop within reach of the previous beam (horiz ≤ 95px centre-to-centre)
    if(off>prevOff+95)off=prevOff+95;
    if(off<prevOff-95)off=prevOff-95;
    plats.push({x:NX+off-w/2,y,w});
    prevOff=off;side*=-1;
    if(rnd()<0.38){plats.push({x:NX-w/2,y:y-50,w:w*0.8});prevOff=0;}  // frequent center beam
  }
  plats.push({x:NX-60,y:SAUCER_Y+200,w:120});              // summit approach: two rungs under the saucer
  plats.push({x:NX-55,y:SAUCER_Y+95,w:110});
  plats.push({x:NX-150,y:SAUCER_Y,w:300,saucer:true});     // saucer deck — the goal
  // snacks on random beams
  const kinds=['fish','fries','coffee','burger'];
  plats.forEach((p,i)=>{
    if(i<2||p.saucer)return;
    const r=rnd();
    if(r<0.55)snacks.push({x:p.x+p.w/2,y:p.y-16,kind:kinds[Math.floor(rnd()*kinds.length)],got:false});
  });
  // seagulls: slow moving platforms
  gulls=[
    {y:GROUND_Y-1300,x:80,dir:1,spd:0.9,w:46},
    {y:GROUND_Y-2600,x:300,dir:-1,spd:1.1,w:46},
    {y:GROUND_Y-3900,x:160,dir:1,spd:1.0,w:46},
  ];
}

// ── State ──
let jim,camY,frame,started,won,winFrame,score,fireworks,wind,windT,downTaps,lastDownT,coffeeT;
function resetGame(){
  buildWorld();
  jim={x:NX-14,y:GROUND_Y-48,w:28,h:48,vx:0,vy:0,onGround:false,face:1};
  camY=WH-VH;frame=0;started=false;won=false;winFrame=0;score=0;
  fireworks=[];wind=0;windT=0;downTaps=0;lastDownT=0;coffeeT=0;
}
resetGame();

// ── Input ──
const keys={};
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
  if(!started&&!won&&(e.key===' '||e.key==='ArrowUp')){startRun();}
  if(won&&winFrame>90&&(e.key===' ')){resetGame();return;}
  keys[e.key]=true;
  if(e.key==='ArrowDown'){                                  // test cheat: 10 rapid ⬇ = warp to saucer approach
    const t=Date.now();
    downTaps=(t-lastDownT<450)?downTaps+1:1;lastDownT=t;
    if(downTaps>=10&&started&&!won){jim.x=NX-14;jim.y=SAUCER_Y-160;jim.vy=0;downTaps=0;}
  }
});
addEventListener('keyup',e=>{keys[e.key]=false;});
function bindBtn(id,key){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();if(!started&&!won)startRun();if(won&&winFrame>90){resetGame();return;}keys[key]=true;});
  el.addEventListener('pointerup',e=>{e.preventDefault();keys[key]=false;});
  el.addEventListener('pointercancel',()=>{keys[key]=false;});
  el.addEventListener('pointerleave',()=>{keys[key]=false;});
}
bindBtn('btn-l','ArrowLeft');bindBtn('btn-r','ArrowRight');bindBtn('btn-j',' ');
C.addEventListener('pointerdown',()=>{if(!started&&!won)startRun();else if(won&&winFrame>90)resetGame();});
function startRun(){started=true;track('level2_start',{});}

// ── Update ──
function update(){
  frame++;
  if(!started||won)return;

  // wind gusts: cosmetic push, no fail state
  windT++;
  if(windT>480&&wind===0){wind=(Math.random()<0.5?-1:1)*0.14;setTimeout(()=>{wind=0;},2200);windT=0;}

  const spd=WALK_SPD;
  if(keys['ArrowLeft']){jim.vx=-spd;jim.face=-1;}
  else if(keys['ArrowRight']){jim.vx=spd;jim.face=1;}
  else jim.vx*=0.7;
  jim.vx+=wind;

  const jv=coffeeT>0?JUMP_VY*1.22:JUMP_VY;
  if((keys[' ']||keys['ArrowUp'])&&jim.onGround){jim.vy=jv;jim.onGround=false;}
  if(coffeeT>0)coffeeT--;

  jim.vy+=GRAVITY;if(jim.vy>13)jim.vy=13;
  const prevBottom=jim.y+jim.h;
  jim.x+=jim.vx;jim.y+=jim.vy;
  if(jim.x<2)jim.x=2;if(jim.x>VW-jim.w-2)jim.x=VW-jim.w-2;

  jim.onGround=false;
  const landOn=(px,py,pw)=>{
    if(jim.vy>=0&&prevBottom<=py+1&&jim.y+jim.h>=py&&jim.x+jim.w>px+4&&jim.x<px+pw-4){
      jim.y=py-jim.h;jim.vy=0;jim.onGround=true;return true;
    }return false;
  };
  for(const p of plats)landOn(p.x,p.y,p.w);
  for(const g of gulls){if(landOn(g.x-g.w/2,g.y,g.w))jim.x+=g.dir*g.spd;}

  // gulls fly
  for(const g of gulls){g.x+=g.dir*g.spd;if(g.x<40||g.x>VW-40)g.dir*=-1;}

  // snacks
  for(const s of snacks){
    if(s.got)continue;
    if(Math.abs(jim.x+jim.w/2-s.x)<26&&Math.abs(jim.y+jim.h/2-s.y)<34){
      s.got=true;score++;
      if(s.kind==='coffee'){coffeeT=420;}
    }
  }

  // camera follows upward
  const target=jim.y-VH*0.55;
  camY+=(Math.max(0,Math.min(WH-VH,target))-camY)*0.12;

  // win: standing on the saucer deck
  if(jim.onGround&&jim.y+jim.h<=SAUCER_Y+2&&jim.y+jim.h>=SAUCER_Y-6){
    won=true;winFrame=0;
    track('level2_win',{snacks:score});
  }
}

// ── Drawing helpers ──
function ell(x,y,rx,ry,col){ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}

function drawJim(x,y,face,airborne){
  // x,y = top-left of hitbox (screen coords). Round body, tiny head — Jimothy canon.
  const cx=x+jim.w/2,cy=y+jim.h*0.62;
  ctx.save();
  ctx.translate(cx,cy);ctx.scale(face,1);
  if(airborne)ctx.rotate(Math.sin(frame*0.25)*0.08);
  // tail
  ell(-20,4,10,7,COL.furDark);
  ctx.fillStyle='#3a342e';ctx.fillRect(-28,-1,6,10);ctx.fillRect(-20,-3,5,13);
  // body
  ell(0,0,17,15,COL.fur);
  ell(2,4,10,9,COL.belly);
  // legs
  ell(-7,13,5,4,COL.furDark);ell(7,13,5,4,COL.furDark);
  // head (small, forward)
  ell(11,-12,9,8,COL.fur);
  ell(9,-15,3,3,COL.furDark);            // ear
  ctx.fillStyle=COL.mask;ctx.beginPath();ctx.ellipse(13,-12,7,3.6,-0.1,0,Math.PI*2);ctx.fill();
  ell(15,-12,2.6,2.6,'#fff');ell(15.8,-12,1.3,1.3,'#000');  // eye
  ell(19,-9.5,2,1.6,'#000');             // nose
  ctx.restore();
  if(coffeeT>0){ctx.fillStyle=`rgba(255,204,68,${0.4+0.3*Math.sin(frame*0.4)})`;ctx.font='10px Courier New';ctx.fillText('☕!',x+4,y-6);}
}

function drawSnack(s,sy){
  if(s.kind==='fish'){ell(s.x,sy,9,4,'#7fb5d6');ctx.fillStyle='#5b93b5';ctx.beginPath();ctx.moveTo(s.x+8,sy);ctx.lineTo(s.x+14,sy-4);ctx.lineTo(s.x+14,sy+4);ctx.fill();ell(s.x-4,sy-1,1.2,1.2,'#123');}
  else if(s.kind==='coffee'){ctx.fillStyle='#e8e2d8';ctx.fillRect(s.x-5,sy-7,10,13);ctx.fillStyle='#2e7d46';ell(s.x,sy-1,4,3,'#2e7d46');ctx.fillStyle='#c9c2b6';ctx.fillRect(s.x-6,sy-9,12,3);}
  else if(s.kind==='fries'){ctx.fillStyle='#d43b2f';ctx.fillRect(s.x-6,sy-4,12,9);ctx.fillStyle='#ffd75e';for(let i=-4;i<=4;i+=3)ctx.fillRect(s.x+i-1,sy-10,2.4,7);}
  else{ell(s.x,sy-2,8,3,'#e0a95a');ell(s.x,sy+1,8,2.5,'#7a4a22');ell(s.x,sy+4,8,3,'#e0a95a');}
}

function drawGull(g,sy){
  const flap=Math.sin(frame*0.3)*5;
  ell(g.x,sy+4,10,5,'#e8ecf2');
  ell(g.x+8*g.dir,sy+1,4,3,'#e8ecf2');
  ctx.fillStyle='#f0b429';ctx.fillRect(g.x+12*g.dir,sy+1,4*g.dir,2);
  ctx.strokeStyle='#cdd5e0';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(g.x-2,sy+2);ctx.lineTo(g.x-12,sy-4+flap);ctx.stroke();
  ctx.beginPath();ctx.moveTo(g.x+2,sy+2);ctx.lineTo(g.x+12,sy-4-flap);ctx.stroke();
}

function drawNeedleStructure(){
  // legs near ground
  const gy=GROUND_Y-camY;
  if(gy>-100){
    ctx.strokeStyle=COL.steelDark;ctx.lineWidth=10;
    ctx.beginPath();ctx.moveTo(NX-120,gy);ctx.quadraticCurveTo(NX-40,gy-190,NX-16,gy-320);ctx.stroke();
    ctx.beginPath();ctx.moveTo(NX+120,gy);ctx.quadraticCurveTo(NX+40,gy-190,NX+16,gy-320);ctx.stroke();
    ctx.lineWidth=6;ctx.strokeStyle=COL.steel;
    ctx.beginPath();ctx.moveTo(NX-114,gy);ctx.quadraticCurveTo(NX-36,gy-190,NX-12,gy-320);ctx.stroke();
    ctx.beginPath();ctx.moveTo(NX+114,gy);ctx.quadraticCurveTo(NX+36,gy-190,NX+12,gy-320);ctx.stroke();
  }
  // central mast: full height
  const topY=SAUCER_Y-camY, botY=Math.min(VH+40,GROUND_Y-camY-300+80);
  ctx.fillStyle=COL.steelDark;ctx.fillRect(NX-13,topY,26,Math.max(0,botY-topY+320));
  ctx.fillStyle=COL.steel;ctx.fillRect(NX-9,topY,12,Math.max(0,botY-topY+320));
  ctx.fillStyle=COL.steelLite;ctx.fillRect(NX-2,topY,3,Math.max(0,botY-topY+320));
  // cross-brace X pattern
  ctx.strokeStyle='rgba(110,120,140,0.55)';ctx.lineWidth=2;
  for(let wy=Math.floor(camY/90)*90;wy<camY+VH+90;wy+=90){
    const sy=wy-camY;
    ctx.beginPath();ctx.moveTo(NX-13,sy);ctx.lineTo(NX+13,sy+45);ctx.stroke();
    ctx.beginPath();ctx.moveTo(NX+13,sy);ctx.lineTo(NX-13,sy+45);ctx.stroke();
  }
}

function drawSaucer(){
  const sy=SAUCER_Y-camY;
  if(sy<-160||sy>VH+80)return;
  // spire above
  ctx.fillStyle=COL.steel;ctx.fillRect(NX-3,sy-118,6,60);
  ctx.fillStyle='#8a93a5';ctx.fillRect(NX-1.5,sy-146,3,30);
  const bl=0.5+0.5*Math.sin(frame*0.12);
  ell(NX,sy-150,4+bl*2,4+bl*2,`rgba(255,60,60,${0.55+bl*0.45})`);
  ell(NX,sy-150,2.5,2.5,'#ff4444');
  // saucer body
  ctx.fillStyle=COL.steelDark;ctx.beginPath();ctx.ellipse(NX,sy-26,150,26,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=COL.steel;ctx.beginPath();ctx.ellipse(NX,sy-32,138,22,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=COL.steelLite;ctx.beginPath();ctx.ellipse(NX,sy-40,96,14,0,0,Math.PI*2);ctx.fill();
  // observation windows
  for(let i=-5;i<=5;i++){
    ctx.fillStyle=(i+6)%2?'#ffd75e':'#9adcff';
    ctx.fillRect(NX+i*22-5,sy-38,10,7);
  }
  // deck platform surface (the goal beam) — subtle rim glow when close
  ctx.fillStyle='#3b4658';ctx.fillRect(NX-150,sy,300,8);
  ctx.fillStyle=COL.gold;ctx.fillRect(NX-150,sy,300,2);
}

function drawBeams(){
  for(const p of plats){
    if(p.saucer)continue;
    const sy=p.y-camY;
    if(sy<-20||sy>VH+20)continue;
    if(p.y===GROUND_Y){ // ground strip
      ctx.fillStyle='#1c3a24';ctx.fillRect(0,sy,VW,VH-sy+10);
      ctx.fillStyle='#2a5232';ctx.fillRect(0,sy,VW,6);
      continue;
    }
    ctx.fillStyle=COL.beamEdge;ctx.fillRect(p.x-2,sy,p.w+4,10);
    ctx.fillStyle=COL.beam;ctx.fillRect(p.x,sy,p.w,7);
    ctx.fillStyle=COL.steelLite;ctx.fillRect(p.x,sy,p.w,2);
    ctx.fillStyle='rgba(40,50,70,0.8)';                     // rivets
    for(let rx=p.x+8;rx<p.x+p.w-6;rx+=22)ctx.fillRect(rx,sy+3,3,3);
  }
}

function drawBG(){
  const sk=ctx.createLinearGradient(0,0,0,VH);
  sk.addColorStop(0,COL.sky0);sk.addColorStop(0.5,COL.sky1);sk.addColorStop(1,COL.sky2);
  ctx.fillStyle=sk;ctx.fillRect(0,0,VW,VH);
  const alt=1-camY/(WH-VH);                                 // 0 ground → 1 top
  // stars (parallax)
  for(let i=0;i<70;i++){
    const hx=(i*137+59)%VW;
    const hy=((i*97+23)+camY*0.12)%VH;
    const tw=0.25+0.55*Math.sin(frame*0.05+i);
    ctx.fillStyle=`rgba(255,255,255,${tw*(0.35+alt*0.5)})`;
    ctx.fillRect(hx,hy,1.6,1.6);
  }
  // moon
  ell(388,80+camY*0.03,26,26,'#e8e4d8');ell(378,72+camY*0.03,7,7,'#cfcabb');ell(398,88+camY*0.03,5,5,'#cfcabb');
  // aurora near the top third
  if(alt>0.55){
    const a=(alt-0.55)/0.45;
    for(let i=0;i<4;i++){
      const hue=(frame*1.5+i*70)%360;
      const yc=60+i*70+Math.sin(frame*0.03+i)*24;
      const ag=ctx.createLinearGradient(0,yc-26,0,yc+26);
      ag.addColorStop(0,'rgba(0,0,0,0)');
      ag.addColorStop(0.5,`hsla(${hue},100%,60%,${0.10*a})`);
      ag.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=ag;ctx.fillRect(0,yc-26,VW,52);
    }
  }
  // city far below (parallax down)
  const cityY=GROUND_Y-camY*0.96;
  if(cityY<VH+140){
    ctx.fillStyle='#101d33';
    const hs=[70,110,55,130,80,95,60,120,72];
    let bx=-10;
    for(let i=0;i<hs.length;i++){
      ctx.fillRect(bx,cityY-hs[i],44,hs[i]+200);
      bx+=52;
    }
    ctx.fillStyle='rgba(255,214,90,0.8)';
    for(let i=0;i<40;i++){
      const wx=(i*61)%VW, wy=cityY-((i*37)%120)-8;
      if(wy<cityY)ctx.fillRect(wx,wy,3,3);
    }
    // Elliott Bay glimmer
    ctx.fillStyle='rgba(30,70,130,0.5)';ctx.fillRect(0,cityY+40,VW,80);
  }
  // drifting clouds at mid altitude
  for(let i=0;i<3;i++){
    const cy2=((i*640+180)-camY*0.55)%(WH*0.55);
    const sy=((cy2%VH)+VH)%VH;
    const cx2=((frame*0.2+i*160)%(VW+120))-60;
    ctx.fillStyle='rgba(190,205,235,0.09)';
    ell(cx2,sy,54,13,'rgba(190,205,235,0.09)');
    ell(cx2+30,sy+5,38,10,'rgba(190,205,235,0.07)');
  }
  // wind gust streaks
  if(wind!==0){
    ctx.strokeStyle='rgba(180,220,255,0.25)';ctx.lineWidth=1.5;
    for(let i=0;i<8;i++){
      const wy=(i*90+frame*6)%VH;
      const wx=(frame*(wind>0?9:-9)+i*70)%(VW+80);
      const x0=((wx%(VW+80))+(VW+80))%(VW+80)-40;
      ctx.beginPath();ctx.moveTo(x0,wy);ctx.lineTo(x0+30*(wind>0?1:-1),wy+3);ctx.stroke();
    }
  }
}

function drawHUD(){
  const climbed=Math.max(0,Math.min(NEEDLE_FT,Math.round((GROUND_Y-48-jim.y)/(GROUND_Y-48-(SAUCER_Y-jim.h))*NEEDLE_FT)));
  ctx.fillStyle='rgba(4,10,24,0.72)';ctx.fillRect(8,8,180,26);
  ctx.strokeStyle='rgba(80,120,190,0.5)';ctx.strokeRect(8,8,180,26);
  ctx.fillStyle=COL.blue;ctx.font='13px Courier New';ctx.textAlign='left';
  ctx.fillText(`⛰ ${climbed} ft · 🍖 ${score}`,16,26);
}

function drawStart(){
  ctx.fillStyle='rgba(3,6,18,0.66)';ctx.fillRect(0,0,VW,VH);
  ctx.textAlign='center';
  const hue=(frame*3)%360;
  ctx.fillStyle='#b080e0';ctx.font='bold 13px Courier New';
  ctx.fillText('P R O T O T Y P E',VW/2,208);
  ctx.fillStyle=`hsl(${hue},100%,68%)`;ctx.font='bold 30px Courier New';
  ctx.fillText('LEVEL 2',VW/2,250);
  ctx.fillStyle=COL.gold;ctx.font='bold 19px Courier New';
  ctx.fillText('🦝 CLIMB THE NEEDLE',VW/2,286);
  ctx.fillStyle='#9fb6d8';ctx.font='13px Courier New';
  ctx.fillText('◀ ▶ move · ⬆/SPACE jump',VW/2,330);
  ctx.fillText('beam by beam, snack by snack,',VW/2,352);
  ctx.fillText(`${NEEDLE_FT} ft to the saucer`,VW/2,370);
  ctx.fillText('☕ coffee = bigger jumps',VW/2,392);
  if(frame%60<40){ctx.fillStyle='#fff';ctx.font='bold 15px Courier New';ctx.fillText('tap / SPACE to start',VW/2,448);}
  ctx.textAlign='left';
}

function drawWinScreen(){
  winFrame++;
  // sky party
  const sk=ctx.createLinearGradient(0,0,0,VH);
  sk.addColorStop(0,'#050210');sk.addColorStop(0.6,'#0a1830');sk.addColorStop(1,'#0e2040');
  ctx.fillStyle=sk;ctx.fillRect(0,0,VW,VH);
  for(let i=0;i<5;i++){
    const hue=(winFrame*2+i*60)%360;
    const yc=VH*0.10+i*VH*0.08+Math.sin(winFrame*0.04+i)*30;
    const ag=ctx.createLinearGradient(0,yc-20,0,yc+20);
    ag.addColorStop(0,'rgba(0,0,0,0)');ag.addColorStop(0.5,`hsla(${hue},100%,58%,0.13)`);ag.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ag;ctx.fillRect(0,yc-20,VW,40);
  }
  for(let i=0;i<60;i++){
    const hx=(i*137+59)%VW, hy=(i*97+23)%(VH*0.7);
    const tw=0.3+0.7*Math.sin(winFrame*0.08+i*0.9);
    ctx.fillStyle=`hsla(${(winFrame*2+i*23)%360},60%,90%,${tw})`;
    ctx.fillRect(hx,hy,2,2);
  }
  // fireworks
  if(winFrame%30===0&&fireworks.length<14)
    fireworks.push({x:40+Math.random()*(VW-80),y:40+Math.random()*260,col:[[255,70,50],[255,215,30],[60,255,120],[50,195,255],[255,70,200]][Math.floor(Math.random()*5)],t:0});
  fireworks.forEach(fw=>{
    fw.t++;
    for(let i=0;i<12;i++){
      const a=(i/12)*Math.PI*2,r=fw.t*2.4;
      const al=Math.max(0,1-fw.t/48);
      ctx.fillStyle=`rgba(${fw.col[0]},${fw.col[1]},${fw.col[2]},${al})`;
      ctx.beginPath();ctx.arc(fw.x+Math.cos(a)*r,fw.y+Math.sin(a)*r,2.6,0,Math.PI*2);ctx.fill();
    }
  });
  fireworks=fireworks.filter(fw=>fw.t<52);
  // saucer with Jimothy on top, centered proudly
  const sy=380;
  ctx.fillStyle=COL.steel;ctx.fillRect(NX-3,sy+8,6,VH);
  ctx.fillStyle=COL.steelDark;ctx.beginPath();ctx.ellipse(NX,sy+2,150,26,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=COL.steel;ctx.beginPath();ctx.ellipse(NX,sy-6,138,22,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=COL.steelLite;ctx.beginPath();ctx.ellipse(NX,sy-14,96,14,0,0,Math.PI*2);ctx.fill();
  for(let i=-5;i<=5;i++){ctx.fillStyle=(i+6)%2?'#ffd75e':'#9adcff';ctx.fillRect(NX+i*22-5,sy-12,10,7);}
  ctx.fillStyle=COL.steel;ctx.fillRect(NX-3,sy-92,6,66);
  const bl=0.5+0.5*Math.sin(winFrame*0.12);
  ell(NX,sy-98,4+bl*3,4+bl*3,`rgba(255,60,60,${0.5+bl*0.5})`);
  // dancing Jimothy on the saucer
  const bounce=Math.abs(Math.sin(winFrame*0.12))*14;
  const jx=NX-14,jy=sy-26-48-bounce;
  const oldFace=jim.face;jim.face=Math.sin(winFrame*0.05)>0?1:-1;
  drawJim(jx,jy,jim.face,true);jim.face=oldFace;
  // panel
  const panH=190,panTop=VH-panH;
  ctx.fillStyle='rgba(2,4,20,0.92)';ctx.fillRect(0,panTop,VW,panH);
  ctx.strokeStyle=`hsl(${(winFrame*4)%360},100%,55%)`;ctx.lineWidth=2;
  ctx.strokeRect(0,panTop,VW,panH);
  ctx.textAlign='center';
  ctx.fillStyle=`hsl(${(winFrame*3)%360},100%,68%)`;ctx.font=`bold ${Math.round(24+Math.sin(winFrame*0.1)*2)}px Courier New`;
  ctx.fillText('🦝 TOP OF THE NEEDLE!',VW/2,panTop+40);
  ctx.fillStyle=COL.blue;ctx.font='15px Courier New';
  ctx.fillText(`${NEEDLE_FT} ft climbed · ${score} snack${score===1?'':'s'}`,VW/2,panTop+70);
  ctx.fillStyle='rgba(255,255,255,0.78)';ctx.font='bold 14px Courier New';
  ctx.fillText('playjimothy.com',VW/2,panTop+98);
  ctx.fillStyle='rgba(200,150,255,0.85)';ctx.font='13px Courier New';
  ctx.fillText('level 2 is a prototype — more soon',VW/2,panTop+124);
  if(winFrame>90&&winFrame%60<40){
    ctx.fillStyle='rgba(160,185,255,0.7)';ctx.font='12px Courier New';
    ctx.fillText('tap / SPACE to climb again',VW/2,panTop+156);
  }
  ctx.textAlign='left';
}

// ── Main draw ──
function draw(){
  drawBG();
  drawNeedleStructure();
  drawBeams();
  drawSaucer();
  for(const s of snacks){
    if(s.got)continue;
    const sy=s.y-camY;
    if(sy>-20&&sy<VH+20)drawSnack(s,sy);
  }
  for(const g of gulls){
    const sy=g.y-camY;
    if(sy>-20&&sy<VH+20)drawGull(g,sy);
  }
  drawJim(jim.x,jim.y-camY,jim.face,!jim.onGround);
  drawHUD();
  if(!started)drawStart();
}

function loop(){
  update();
  if(won)drawWinScreen();
  else draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
